- Prefer scoped exact identifiers (execution/lease ids) for recovery and cleanup over broad listings (also in the
  2026-11-18 and 2026-11-20 events).
- Obtain Sol/Codex review for security- or approval-sensitive changes when quota returns; GLM-5.3 is corroborating only.
