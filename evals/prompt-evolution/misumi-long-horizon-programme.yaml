    targets:
      - inventory deployed state on every involved host (scheduled tasks, services, release provenance, stores) before designing any persistent mechanism; deployed state outranks repository and audit prose, and a contradiction is an Opus gate
      - probe a paid lane with a one-call smoke test and resolve the exact client version before a long dispatch; on quota exhaustion record the reset time, block only the affected action and continue other lanes
      - enumerate every consumer of a coupled flag when splitting it, test each consumer and direction, mutation-check each guard, and preserve the old meaning for callers that omit the new control
      - surface likely operator-permission gates together at session start, record exact denials and do not retry them in pieces
      - make resume prompts re-read live state and skip completed steps
      - keep remote-shell transport simple (files over stdin or encoded commands, local JSON parsing, no cleanup verbs in command text)
