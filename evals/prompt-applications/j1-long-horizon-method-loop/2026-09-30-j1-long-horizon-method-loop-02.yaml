revision_reason: >-
  Four evidence-backed defects demonstrated this session. (1) Long unattended
  bulk runs were launched on model lanes without probing headroom: GLM at 16
  workers produced 429 failures, 14 parallel Claude agents hit the session limit
  and died mid-batch, Codex ran out silently (the runner discarded stderr so an
  empty stdout looked like a parse failure), and a second driver was started on
  the same work; the operator also had to correct a misreading (an instruction
  to continue the work with other lanes was acted on as stopping the running
  driver). A bulk run should start with a one-call quota smoke, cap concurrency
  to what the lane sustains, capture stderr, never start a second driver on the
  same queue, and stop a lane at its first quota error. (2) A text-extraction
  mode that interleaved two-column text failed 25 of 61 quotes on the first
  paper; it was caught only because quote verification ran on a pilot before
  scale. A pilot of the extraction mode and the claim unit should precede bulk
  extraction. (3) The first summary count (every eligible study carrying a
  pattern) was an artefact of an over-inclusive claim unit; a result that fits
  the hypothesis everywhere is a prompt to audit the unit, not a finding, and the
  claim unit must be registered so design and outlook sentences cannot be coded
  as attribution. (4) Tallies written into a record from memory were wrong and
  were corrected only on re-derivation; every figure should be recomputed from
  the data immediately before it is written.
