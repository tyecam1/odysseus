revision_reason: >-
  Two evidence-backed defects. (1) The operator changed the requested Sol model
  mid-session to a newer identifier than the repo policy pin. The installed CLI
  listed it in its catalogue but the service rejected the first dispatch; the same
  packet succeeded on the Codex desktop app's bundled newer client. The initialiser
  says to reconcile the requested model with live policy but not what to do when the
  requested identifier is newer than the pin: confirm it in the catalogue, smoke-test
  the exact client before packeting, treat a refusal from one client version as a
  client limit rather than a model verdict, try the vendor's newer client, record the
  deviation from the policy pin, and leave the governed policy files for an operator
  step. (2) Open-access pages read through the browser: a truncating extraction is a
  read tier, not a full read. What worked was an in-page string test for each quoted
  passage, whole-text term counts for any absence statement, and a rendered-image
  inspection of the results figures when the results are plots; the reviewer should be
  told plainly when it can only see transcribed evidence. The v4/v5 rule to use
  absolute paths instead of a persistent shell cd was violated three times this
  session and is preserved, not reworded. v5's pointer-first packet, separate
  withheld file, deterministic figure-range and passive-load rules performed well
  (the reviewer answered before opening the withheld file and the transcript confirms
  it) and are preserved.
