revision_reason: >-
  Evolve to v3. The deterministic planner returned evolve for this trace, and the
  register's own rule applies: a failure class that recurs despite existing
  instruction text should be restructured. Shell and API transport pitfalls were
  tagged in both applications although v2 refinement 6 existed, so the guidance
  becomes a checklist (probe the host's default shell, pass structured API bodies
  as files, decide success from exit codes, assert replacement anchors match
  once, keep cleanup verbs out of command text). The session also reported the
  frontier exhausted while Phase 4, GPU admission and tracing were
  dependency-ready, which v2's stop rule already forbade but did not make
  checkable, so a pre-stop check is added (classify every remaining contract item
  as human-only gate, environment condition or executable). A denied merge showed
  that merging to a protected branch was missing from the permission gates
  surfaced together at session start, and the trace was persisted only when
  prompted, so a hand-back that reports a stop now counts as the end of the
  session for tracing. Each change only adds a gate or a check; no scope,
  authority, verification, model-identity or stop rule is weakened.evidence:
