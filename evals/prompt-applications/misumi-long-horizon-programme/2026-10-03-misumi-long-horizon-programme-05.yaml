  the deploy scripts' own safety nets) absorbed it - one TLS-hostname mistake was caught by the deploy script's
  rollback safety net and fixed on re-run, which is the tooling fix working as designed. The genuinely recurring class
  is trace discipline: v3 already contains the pre-stop rule to persist the trace and evolution event before a
  hand-back, and the -05 hand-back still left no trace (second occurrence after -02). That is a lapse in applying an
  existing rule, not missing prompt content; if it recurs a third time, the fix should move out of prompt text into
  tooling (for example extending the publish/stop checklist script to fail closed without a trace), as was done for
  the transport class. The reboot-persistence tag records that the defect was found by a household incident rather
  than by design review of the logon-triggered lifecycle; the v3 evolution target about inventorying deployed state
  was applied, and the machine-start redesign is the corrective outcome, so no new prompt text is added.
