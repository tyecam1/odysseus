# Misumi lead-persona routing corpus - DEV split v1 (application -09, 2026-10-05).
#
# Purpose: measure how well a routing algorithm picks the lead persona a sensible household user
# would intend, per directive category, WITHOUT hiding weaknesses behind learned routing state.
#
# `intended` is the HUMAN label: the persona a sensible user would expect to lead. It is NOT the
# output of any router. `acceptable` lists other defensible leads (lenient scoring). The baseline
# and candidate columns are computed by scripts/misumi_routing_corpus_eval.py, never hand-written.
# Labelling conventions:
#   * multi-intent: intended = the first-stated task; acceptable = every task's persona.
#   * reserved matters (standards/values/boundaries/ratification/Level 5-6) -> aoteru BY CONTRACT,
#     even when the reserved word is incidental. That is contract behaviour, not a router weakness.
#   * a persona NAME or a bracketed/meta "route this to X" instruction inside the prompt is NOT evidence;
#     the lead follows the topic.
#   * follow-ups carry `prior_prompt` + `prior_lead` (the lead of the previous turn).
# This is the DEV split: the candidate algorithm was tuned against it. Generalisation is measured on
# corpus-heldout-v1.yaml, authored after the candidate was frozen.
schema_version: 1
split: dev
# CORRECTION 2026-10-06: reference_intents is the LIVE manifest (tyecam1/misumi config/personas.yaml at main 0d5bdb6aec,
# routing.intents in manifest order, incl. kino). It originally carried the -07 fixture's frozen table, which had drifted
# from production (e.g. l had budget/bills, misato chores, ichigo deadline/blocked; manifest order differed). Item labels are
# unchanged; measurements were re-run against the live manifest.
reference_intents:
  aoteru: "default, standards, coherence, boundaries, integration"
  erwin: "priorities, planning, risk, strategy, recovery"
  lelouch: "workflows, protocols, tasks, process, implementation"
  misato: "cleaning, rota, care, rest, wellbeing"
  kurisu: "capture, memory, archive, evidence, transcript"
  l: "money, finance, anomaly, waste, diagnostics"
  ginko: "plants, damp, pests, environment, watering"
  sanji: "food, meals, shopping, stock, recipes"
  jin: "records, music, gigs, wantlist, listening"
  ichigo: "overdue, urgent, closure, safety, stalled"
  giorno: "ideas, evolution, experiments, opportunities, repurpose"
  kino: "phd, vault, profile, personal, exports, context"
# RATIFIED 2026-10-06 (routing contract v0.2): routing.aliases in config/personas.yaml, lower-weight everyday words per persona,
# mirrored here so the corpus is measured against exactly what production reads (minus any word production already lists as an intent).
reference_aliases:
  lelouch: "procedure, checklist, runbook, pipeline, sop"
  kurisu: "notes, minutes, remember, conversation, saved"
  misato: "bin, bins, dishes, dishwasher, laundry, tidy, mess, hoover, vacuum, mop, washing, housework, chores"
  jin: "vinyl, album, albums, song, songs, stereo, playlist, band, gig, turntable"
  erwin: "roadmap, prioritise, prioritize, goals, tradeoff, quarter"
  l: "spending, charged, payment, invoice, invoices, bank, cost, expense, expenses, subscription, overspend, billing, budget, bills"
  ginko: "plant, water, herbs, tomatoes, seedlings, leaves, compost, soil, greenhouse, weeds, windowsill, garden"
  sanji: "dinner, lunch, breakfast, cook, cooking, fridge, groceries, milk, meal, recipe, shop, supper, pantry, ingredients, leftovers"
  ichigo: "stuck, wedged, asap, emergency, deadline, blocked"
  giorno: "experiment, evolve, trial, growth"
