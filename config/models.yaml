# Aoteru estate — model/capability alias registry.
#
# P1 scaffold (plan section 9), now aligned to
# docs/aoteru-model-host-routing-contract.md's alias set (Phase B). Aliases
# renamed general-fast/general-strong -> local-fast/local-strong to match
# the routing contract exactly — same concept, contract is now binding
# architecture so the naming here follows it rather than drifting.
#
# Bindings are `null` until real benchmark evidence supports them — see
# docs/aoteru-estate-p7-evidence.md. A binding with no evidence would be
# exactly the kind of unearned "false completion" the execution contract
# forbids. Bound aliases below are backed by the P7 measurements, not
# vendor claims.
#
# LM1 (docs/aoteru-local-model-benchmark-routing-evidence.md, 2026-08-21)
# screened the three docs/aoteru-lab-local-model-strategy-2026-08-20.md
# first-round candidates through the reusable evals/local_models/ harness.
# Net result: zero binding changes below — every candidate either lost to
# an incumbent on measured evidence, or (Gemma 4 E4B / Gemma 4 12B) cannot
# be bound at all yet because production Ollama (0.19.0) has no `gemma4`
# architecture support; both only ran on a temporary, non-production
# second Ollama instance this pass, torn down at the end of LM1. See that
# evidence doc for the full per-task-class comparison and the exact
# operator action that unblocks Gemma 4. Candidate strategy-doc alias
# names (local-small/local-agent/local-multimodal/local-code/local-deep)
# map onto this file's live aliases as: local-small -> local-fast,
# local-agent/local-code -> code-fast, local-multimodal -> vision,
# local-strong/local-deep -> local-strong/reasoning-strong — recorded here
# so a future pass doesn't invent a second alias vocabulary.

capabilities:
  - alias: local-fast
    binding: qwen3:8b
    evidence: docs/aoteru-estate-p7-evidence.md
    note: >-
      106.1 decode tok/s, fits fully in 10GB VRAM (`ollama ps` confirmed
      100% GPU). Measured on one representative coding prompt at 8K
      context — a single data point, not a full quality-floor benchmark.
      LM4 (2026-08-23): production canary disposition RETAIN — 3/3 pass
      (repo_reconnaissance x2, compact_summarisation x1) through the real
      production route (`src.estate_router.run_task`). See
      docs/aoteru-lm4-production-canary-evidence.md.
  - alias: local-strong
    binding: gpt-oss:20b
    evidence: docs/aoteru-estate-p7-evidence.md
    note: >-
      23.6 decode tok/s despite exceeding VRAM (partial CPU offload) —
      matches plan §9's own "GPT-OSS 20B" candidate. Same single-prompt
      caveat as local-fast.
      LM4 (2026-08-23): production canary disposition RETAIN — 3/3 pass
      (fault_diagnosis, independent_review, long_context@32K) through the
      real production route. See docs/aoteru-lm4-production-canary-evidence.md.
  - alias: code-fast
    binding: ornith:9b
    evidence: docs/aoteru-lm2-model-discovery-evidence.md
    note: >-
      LM3 (2026-08-23): production Ollama upgraded 0.19.0 -> 0.32.15
      (requires >= 0.30.11 per `ollama show ornith:9b`); pulled cleanly
      onto production. Bound after a production-path smoke
      (code_repair-01, real `src.estate_router.execute_local` against
      127.0.0.1:11434) passed 3/3 pytest, matching LM2's 39/39-trial
      evidence. See docs/aoteru-lm3-production-runtime-promotion-evidence.md.
      LM4 (2026-08-23): production canary disposition RETAIN — 3/3 pass
      (bounded_code_repair, tool_function_call_correctness,
      strict_json_schema_output) through the real production route. See
      docs/aoteru-lm4-production-canary-evidence.md.
  - alias: code-strong
    binding: null
  - alias: reasoning-strong
    binding: nemotron-3.5-lightning:30b-a3b
    evidence: docs/aoteru-lm2-model-discovery-evidence.md
    note: >-
      LM3 (2026-08-23): production Ollama upgraded 0.19.0 -> 0.32.15
      (requires >= 0.32.9 per `ollama show`); pulled cleanly onto
      production (25GB). Bound after a production-path smoke
      (scientific_reasoning-01, real `src.estate_router.execute_local`
      against 127.0.0.1:11434) passed keyword gate at 34.9s, consistent
      with LM2's 36/39-trial evidence and ~29s avg latency. No incumbent
      to regress — this alias was previously unbound. See
      docs/aoteru-lm3-production-runtime-promotion-evidence.md.
      LM4 (2026-08-23): production canary disposition RETAIN — 2/2 pass
      (phd_scientific_reasoning, ros_log_test_interpretation) through the
      real production route. See docs/aoteru-lm4-production-canary-evidence.md.
  - alias: vision
    binding: gemma4:12b
    evidence: docs/aoteru-lm2-model-discovery-evidence.md
    note: >-
      LM3 (2026-08-23): production Ollama upgraded 0.19.0 -> 0.32.15
      (requires >= 0.30.5 per `ollama show`); `gemma4:12b` pulled cleanly
      from the Ollama library onto production. Artifact mismatch vs LM2's
      promotable evidence disclosed: LM2's 37/42 (vision 3/3) result ran
      the official QAT Q4_0 GGUF directly via llama.cpp, not this
      Ollama-library Q4_K_M build — not assumed equivalent. Instead ran
      the tiny equivalence check the task allows: doc_image-01 through the
      real production path (`src.estate_router.execute_local` against
      127.0.0.1:11434) — model correctly read "7421" MiB from the image
      (11.9B dense, same architecture/param count as LM2's tested
      artifact). Bound on that production-path parity result, not on
      LM2's llama.cpp evidence directly. See
      docs/aoteru-lm3-production-runtime-promotion-evidence.md.
      LM4 (2026-08-23): production canary disposition RETAIN, vision
      caution closed. Ran doc_image-01 three independent times through
      the real production route (`src.estate_router.resolve_route` +
      `src.llm_core.llm_call` against 127.0.0.1:11434, the same
      Ollama-library `gemma4:12b` artifact bound above) — 3/3 pass,
      correctly reading "7421" MiB each time. Combined with LM3's own
      equivalence check this is now 4/4 independent production-path
      passes on the bound artifact itself, closing the "modestly broader
      coverage" gap the LM3 note left open — no longer resting on a
      single trial. See docs/aoteru-lm4-production-canary-evidence.md.
  - alias: embedding
    binding: qwen3-embedding:8b
    note: structural binding only (it is literally an embedding model) — no retrieval-quality benchmark run yet.
  - alias: reranker
    binding: dengcao/Qwen3-Reranker-8B:Q4_K_M
    note: structural binding only, same caveat as embedding.

# Candidates under consideration per the canonical plan — not selections.
# None of these are installed; downloading them is a deliberate resource
# decision (multi-GB each), not something to grab speculatively.
#
# Corrected by LM1 (2026-08-21) to match the *current* second-round
# shortlist in docs/aoteru-lab-local-model-strategy-2026-08-20.md — the
# previous list here (Qwen3.6-35B-A3B, Qwen3.6-27B, GLM-4.7-Flash-30B-A3B,
# Devstral-Small-2-24B, Qwen3-Coder-Next) was a stale P7-era list that had
# drifted from the actual research doc; explicitly out of LM1's own scope
# (second-round), left for a future pass, not evaluated here.
benchmark_candidates:
  - Qwen3.6-35B-A3B       # local-strong challenger
  - Nemotron-3.5-Lightning-30B-A3B  # local-challenger
  - Qwen3.8-27B           # local-deep challenger

# Already benchmarked and available for further evaluation without any new
# download (docs/aoteru-estate-p7-evidence.md, LM1 evidence doc for the
# three added this pass). Each entry carries an explicit `state` rather
# than letting "present in this list" be read as "production-runnable" —
# LM1 audit found Gemma 4 E4B/12B recorded here with only an inline
# comment explaining they were never actually installed on production,
# which is exactly the kind of state code could misread. `state` is one
# of: production-installed (pullable/runnable via config/estate.yaml's
# production Ollama, 127.0.0.1:11434) | benchmark-only (real, measured
# LM1 evidence, but not reachable through production execute_local) |
# candidate (not yet downloaded/run — see benchmark_candidates below) |
# unavailable (blocked, e.g. licence/runtime/hardware).
installed_candidates:
  - model: qwen3:8b
    state: production-installed
  - model: gpt-oss:20b
    state: production-installed
  - model: qwen3:30b
    state: production-installed
  - model: qwen3-embedding:8b
    state: production-installed
  - model: dengcao/Qwen3-Reranker-8B:Q4_K_M
    state: production-installed
  - model: qwen3.5:9b
    state: production-installed
    note: "LM1: installed on production Ollama, screened, not promoted (evidence doc)"
  - model: gemma4:e4b
    state: benchmark-only
    note: >-
      LM1: screened (3 trials) via a temporary, non-production second
      Ollama instance, since torn down. NOT installed on production
      Ollama (0.19.0 has no gemma4 architecture support) and cannot be
      routed to yet — see evidence doc blocker/operator action.
  - model: gemma4:12b
    state: production-installed
    note: >-
      LM1: screened (3 trials, 11/13) via a temporary, non-production
      second Ollama instance. LM3 (2026-08-23): after the Ollama 0.19.0
      -> 0.32.15 upgrade, this Ollama-library artifact (Q4_K_M, requires
      >= 0.30.5) pulled cleanly onto production. This is NOT the exact
      artifact LM2's promotable vision evidence used (see
      gemma4:12b-qat-gguf-direct below) — bound to capabilities.vision on
      its own production-path equivalence check (doc_image-01 passed
      through real execute_local), not on LM2's llama.cpp numbers
      directly. See docs/aoteru-lm3-production-runtime-promotion-evidence.md.
  - model: qwen3.6:35b
    state: production-installed
    note: >-
      LM2: pulled cleanly onto production Ollama (0.19.0 accepted this
      manifest, unlike most LM2 candidates). Screened (11/13 pass, 1
      timeout on 32K context under hybrid CPU/GPU offload); rejected for
      local-strong on latency (avg 93.2s/call vs gpt-oss:20b's 15.2s) —
      see LM2 evidence doc. Installed but not bound to any capability.
  - model: qwen3.8:27b
    state: benchmark-only
    note: >-
      LM2: screened (12/14 pass) via the temporary second Ollama instance
      (production 0.19.0 returns 412 "requires a newer version of Ollama"
      on this manifest). Rejected for reasoning-strong on latency (avg
      55.5s/call, one 32K timeout) vs. Nemotron 3.5 Lightning's clean run
      — see LM2 evidence doc. Not installed on production, not bound.
  - model: lfm2.5:8b
    state: benchmark-only
    note: >-
      LM2: screened + 3-trial finalist sweep via the temporary second
      Ollama instance (production 0.19.0 412s on this manifest — same
      class of blocker LM1 found for Gemma 4, broader this pass). 38/39
      pass across 3 trials, avg 2.5-2.8s/call. Strong evidence for
      code-fast but Ornith-1.0-9B has a perfect record at comparable
      latency and this repo has only one code-oriented alias slot; not
      bound. Cannot bind to production execute_local until the operator
      upgrades production Ollama regardless — see LM2 evidence doc.
  - model: ornith:9b
    state: production-installed
    note: >-
      LM2: screened + 3-trial finalist sweep via the temporary second
      Ollama instance. Perfect 39/39 across 3 trials, avg 3.6-6.1s/call —
      the strongest evidence any LM2 candidate produced. LM3 (2026-08-23):
      pulled cleanly onto production after the Ollama 0.19.0 -> 0.32.15
      upgrade; production-path smoke passed; bound to capabilities.code-fast.
  - model: gemma4:12b-qat-gguf-direct
    state: benchmark-only
    note: >-
      LM2: official QAT Q4_0 GGUF (google/gemma-4-12B-it-qat-q4_0-gguf)
      run directly via a scratch llama.cpp server (Vulkan backend, no
      production Ollama involved at all) -- the specific "QAT vs
      Ollama-library" comparison LM1 flagged as unresolved. 3 trials =
      37/42 (88.1%), vision (doc_image-01) passed all 3 -- beats LM1's
      gemma4:12b Ollama-library result (11/13). Stays benchmark-only: this
      exact artifact (llama.cpp, official QAT Q4_0 GGUF) was never
      installed on production and LM3 (2026-08-23) did not assume it
      equivalent to the Ollama-library gemma4:12b bound to
      capabilities.vision -- that binding rests on its own production-path
      equivalence check (doc_image-01 via real execute_local), not on this
      row's numbers. This row remains a distinct, not reproduced-in-
      production artifact for the record.
  - model: nemotron-3.5-lightning:30b-a3b
    state: production-installed
    note: >-
      LM2: screened + 3-trial finalist sweep via the temporary second
      Ollama instance. 36/39 pass across 3 trials (92.3%), no
      errors/timeouts; reasoning-strong had zero incumbent so this cleared
      the bar on evidence alone. LM3 (2026-08-23): pulled cleanly onto
      production after the Ollama 0.19.0 -> 0.32.15 upgrade; production-path
      smoke passed; bound to capabilities.reasoning-strong.

# Economic ladder — seed policy only; P7/live benchmark evidence overrides
# it (docs/aoteru-model-host-routing-contract.md "Default economic ladder").
# Concrete provider/model classes at rungs 3-6 are NOT configured in this
# lab-first instance (no ModelEndpoint rows for a paid provider exist yet
# in the isolated svc:odysseus-lab deployment) — resolving to those rungs
# must fail truthfully as "no endpoint configured", not silently no-op.
economic_ladder:
  - rung: 0
    mechanism: deterministic
  - rung: 1
    mechanism: local-fast
  - rung: 2
    mechanism: local-strong
  - rung: 3
    mechanism: luna-or-haiku-class
  - rung: 4
    mechanism: terra-or-sonnet-class
  - rung: 5
    mechanism: sol-class
  - rung: 6
    mechanism: opus-class
