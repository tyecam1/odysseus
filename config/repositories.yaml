# Aoteru estate — repository registry (P1, plan section 4).
#
# Logical repo IDs only. No secrets, no physical host paths — `path` is a
# template resolved against a host-local root variable from
# ~/.aoteru/config.local.json (never committed). `agent status`/`agent where`
# report a repo as unresolved on a host where its root variable isn't set or
# the path doesn't exist, rather than guessing.
#
# `authority` names the repo that owns the concepts documented in
# docs/aoteru-estate-execution-contract.md's Authority section. Odysseus
# never becomes the canonical owner of another repo's domain content by
# being the one that indexes/discovers it.

repos:
  - id: odysseus
    description: Aoteru target — canonical estate runtime (this repo)
    authority: odysseus
    remote: https://github.com/tyecam1/odysseus.git
    root_var: AI_ROOT
    path: "${AI_ROOT}/odysseus-aoteru"
    canonical: true

  - id: odysseus-upstream-lab
    description: >-
      Upstream/runtime capability source (pewdiepie-archdaemon/odysseus).
      Inspected capability-by-capability per the execution contract's
      Odysseus lineage section; not a parking target and not authoritative
      for anything the canonical repo already owns.
    authority: odysseus
    remote: https://github.com/pewdiepie-archdaemon/odysseus.git
    root_var: AI_ROOT
    path: "${AI_ROOT}/odysseus"
    canonical: false
    role: capability-source

  - id: misumi
    description: Aoteru persona and household policy
    authority: misumi
    remote: https://github.com/tyecam1/misumi.git
    default_branch: main
    root_var: HOUSEHOLD_ROOT
    path: "${HOUSEHOLD_ROOT}/misumi"
    canonical: false
    notes: >-
      Remote confirmed 2026-08-23 (final convergence pass) via
      authenticated `gh repo view tyecam1/misumi` (private, default
      branch main) — no longer `remote: null`. Live-cloned read-only on
      this host under HOUSEHOLD_ROOT=/home/agent/projects/household (a
      controlled lab-side location for governance/validation, per
      docs/aoteru-final-convergence-activation.agent-task.md item B) —
      this does NOT redefine misumi's canonical location, which stays a
      home-host decision.

  - id: obsidian-phd
    description: PhD knowledge, research workflow, evidence/trust/write gates
    authority: obsidian-phd
    remote: https://github.com/tyecam1/obsidian-PhD.git
    default_branch: main
    root_var: PHD_ROOT
    path: "${PHD_ROOT}/obsidian-PhD"
    canonical: false
    notes: >-
      Remote confirmed 2026-08-23 (final convergence pass) via
      authenticated `gh repo view tyecam1/obsidian-PhD` (private, default
      branch main) — no longer `remote: null`. Live-cloned read-only on
      this host under PHD_ROOT=/home/agent/projects/phd (a controlled
      lab-side location for governance/validation, per docs/aoteru-
      final-convergence-activation.agent-task.md item B) — this does NOT
      redefine obsidian-PhD's canonical location, which stays a
      home-host decision.

  - id: s2-e1-ros2-measurement-spine
    description: >-
      ROS 2 measurement/experiment codebase named in the Workstream F
      inventory (docs/aoteru-long-horizon-autonomous-convergence.agent-
      task.md) — the glovebox Jetson's likely experiment-edge software,
      per config/estate.yaml's glovebox capability tags (ros2, realsense,
      experiment-capture).
    authority: s2-e1-ros2-measurement-spine
    remote: https://github.com/tyecam1/s2-e1-ros2-measurement-spine.git
    default_branch: main
    root_var: PHD_ROOT  # confirmed correct 2026-08-23 — real clone landed at PHD_ROOT/s2-e1-ros2-measurement-spine with no path mismatch
    path: "${PHD_ROOT}/s2-e1-ros2-measurement-spine"  # confirmed 2026-08-23 — matches the real repo name exactly (gh repo view), no longer an assumption
    canonical: false
    notes: >-
      Remote/path ASSUMED fields from an earlier pass now confirmed
      2026-08-23 (final convergence pass) via authenticated `gh repo
      view tyecam1/s2-e1-ros2-measurement-spine` (private, default
      branch main) and a real clone at PHD_ROOT/s2-e1-ros2-measurement-
      spine on this host — path/root_var needed no correction.
