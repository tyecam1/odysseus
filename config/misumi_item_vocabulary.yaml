# Misumi household item vocabulary: general words and the specific items they cover, plus synonym groups.
#
# Used ONLY to stop a false "no": when a stock or shopping question names an item that no record names exactly, records related
# through this table are offered as candidates ("Not confirmed: ... recorded items that may match: brie, Parmigiano Reggiano").
# A relation here never turns a question into a confident "yes": only a record's own name or its own `aliases:` can do that.
#
# Format (all entries lower case, singular or plural - they are normalised the same way as item names):
#   kinds:    general word -> specific items that are a kind of it (one level; looked up in both directions)
#   synonyms: groups of names for the same thing
# Tested by tests/test_misumi_item_resolution.py (the file must load, and every relation must be symmetric where promised).
version: 1

kinds:
  cheese: [brie, camembert, cheddar, parmesan, parmigiano, parmigiano reggiano, grana padano, pecorino, mozzarella, burrata,
           feta, halloumi, gouda, edam, emmental, gruyere, comte, stilton, roquefort, gorgonzola, manchego, ricotta, mascarpone,
           paneer, cream cheese, cottage cheese, goat cheese, red leicester, wensleydale]
