services:
  - id: svc:aoteru
    description: authenticated Aoteru/Odysseus front door
    endpoint: null
    role: interface
    notes: >-
      Corrected 2026-08-20 (operator): belongs on the interface PC
      (`interface-pc` / `desktop-rifpr07` — the id here was stale,
      pre-P12 naming still pointed at `desktop-7dj1hma`, which is the
      laptop, not the interface PC), not lab. Lab hosts backend capability
      only. `interface-pc` is now reachable (2026-08-29) but nothing
      resembling `svc:aoteru` runs there yet (live-confirmed: only two
      small idle python.exe processes, no listening service found) — stays
      null/deferred until actually built, not merely because the box was
      unreachable.
  - id: svc:memory
    description: memory broker API (home primary, lab read-cache fallback)
    endpoint: null
  - id: svc:models-lab
    description: model serving on the lab host
    endpoint: null
  - id: svc:models-home
    description: model serving on the home host
    endpoint: null
  - id: svc:odysseus-lab
    description: Odysseus backend instance on the lab host (API/jobs/memory/
      RAG — not the user-facing interface)
    endpoint: http://dmem-hp-z2-tower-g9-workstation-desktop-pc.tail171792.ts.net:8080
    local_endpoint: http://127.0.0.1:7001  # what tailscale serve proxies to
    role: backend
    tailnet_exposure: live-http-tailnet-only
    notes: >-
      Running natively (venv, uvicorn, port 7001; upstream lab deployment
      already owns 7000). Own dedicated ChromaDB on 127.0.0.1:8101 —
      collection names are global/deterministic (src/chroma_client.py), so
      sharing port 8100 with the upstream deployment would mean writing
      into its live vector collections; kept fully separate instead.
      AUTH_ENABLED=true, LOCALHOST_BYPASS=false, verified (unauthenticated
      GET / -> 302, /api/health -> 200 unauthenticated by design).
      Exposed privately over the tailnet via `tailscale serve --bg
      --http=8080` (plain HTTP, no TLS — HTTPS Certificates aren't enabled
      for this tailnet). Confirmed via `tailscale serve status --json`:
      `Web` handler only, no `AllowFunnel` key — tailnet-only, not public.
      End-to-end self-test from this host over the tailnet URL: GET / -> 302,
      GET /api/health -> 200. Required a one-time operator-run
      `sudo tailscale set --operator=agent` — `tailscale serve` needs root
      otherwise, and sudo itself is classifier-blocked from this session.
      the cert requirement but network/identity actions have now been
      classifier-blocked twice this session (SSH reconnaissance earlier,
      cert issuance here) — treating that as a pattern to get explicit
      operator sign-off on, not route around.
  - id: svc:odysseus-home
    description: Odysseus instance on the home host
    endpoint: null
    notes: >-
      2026-08-29 discovery: an Odysseus-harness instance IS already
      running on home (`http://192.168.4.102:420`, live `/api/health` ->
      200 healthy) — but it is the operator's household/Misumi deployment
      (`odysseus-releases\e68288238b3c`, governed by a separate pre-existing
      `flat-knowledgebase`/`homeBase` repo), not an estate-routing backend.
      Live-audited: no `src/estate_router.py`, no `config/estate.yaml`, no
      "estate" string anywhere in `app.py` — structurally incapable of
      acting as a second discovery/routing/lease authority. `endpoint`
      deliberately stays null here: this id names an *estate-callable*
      Odysseus backend on home, which does not exist and is not planned —
      conflating the two would misroute estate tasks into a household
      deployment with no estate/park/lease surface at all.

