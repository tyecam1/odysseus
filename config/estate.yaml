# Aoteru estate — host/service registry (P1, plan section 4).
#
# Hosts are added here only once genuinely inventoried or explicitly named
# by the operator — never speculatively. `verified: false` / `tailscale:
# false` / `os: unknown` mean exactly that: named, not yet confirmed.
#
# P12.7 re-entry (2026-08-29, first laptop-run session — see
# docs/aoteru-p12-active-estate-convergence-evidence.md and its P13
# addendum): home (`desktop-in7o23d`) and the interface PC
# (`desktop-rifpr07`, formerly `interface-pc` with unknown identity) are
# both now live-confirmed reachable over LAN SSH and Tailscale, with
# pinned/matching SSH host-key fingerprints. `verified: true` on
# `interface-pc` is safe (the `interface` role is never
# execution_worker-eligible regardless, config/routing.yaml). `home`
# deliberately stays `verified: false` — identity is confirmed but
# execution-worker eligibility additionally needs P12.7's benchmark
# evidence (item 4), which `eligible_hosts()` has no separate gate for
# today; see that host's notes and the evidence doc's residual risks.
# registered != reachable != verified != execution-worker-eligible.
#
# Services are logical names (plan section 5.6). None are provisioned yet —
# that's P2 (private connectivity). `endpoint: null` means "not live";
# `agent status` must report that plainly, not fabricate a reachable URL.

# Required connectivity (re-derived 2026-08-19 from the canonical plan
# gates, not from what happens to be reachable from wherever this file is
# being edited): the plan's management/parking transport is laptop→worker
# (§10.2 "the launcher SSHs to the parked worker"), plus phone→svc:aoteru
# for the mobile surface. lab→laptop and lab→home are NOT gate
# requirements — an earlier revision of this registry/evidence mistakenly
# treated lab→laptop unreachability as a P2 blocker. It isn't tracked here.
required_connectivity:
  - edge: laptop-to-lab
    from: desktop-7dj1hma
    to: hz2-workstation
    status: http-proven-ssh-policy-blocked
    note: >-
      2026-08-29, first laptop-run session (closes the P12.1 continuation
      gate): `aoteru status` from the laptop against
      `svc:odysseus-lab`'s tailnet URL succeeds end-to-end (`backend:
      reachable, status=healthy`) — this is the actual transport
      `companion/laptop_client/aoteru.py` / the estate-routing skill use,
      and it is proven both directions now. Separately tried plain `ssh
      dmem-hp-z2-tower-g9-workstation-desktop-pc.tail171792.ts.net` (the
      §10.2 "launcher SSHs to the parked worker" transport) — reached the
      host but was rejected by Tailscale SSH's tailnet ACL policy
      ("tailnet policy does not permit you to SSH as user \"tyeca\""), not
      a network/reachability failure. Not fixed this pass — tailnet ACL
      policy is an admin-console change, out of scope unless a task
      actually needs laptop→lab SSH (park/parking already works over the
      HTTP surface per P12.1's evidence).
  - edge: laptop-to-home
    from: desktop-7dj1hma
    to: desktop-in7o23d
    status: proven
    note: >-
      2026-08-29, first laptop-run session. Proven both ways: LAN SSH
      (`192.168.4.102`, pre-existing `homebase-agent` key, host-key
      fingerprint matched the operator-supplied pin exactly before
      connecting) and, after Tailscale enrollment this pass, over the
      tailnet (`100.105.34.37`, same fingerprint reconfirmed).
  - edge: laptop-to-interface
    from: desktop-7dj1hma
    to: interface-pc
    status: proven
    note: >-
      2026-08-29, first laptop-run session, first time this edge has ever
      been tested (interface PC was previously unreachable). Proven both
      ways: LAN SSH (`mutisy@192.168.4.37`, laptop's existing
      `tyeca-laptop` key, per the operator's own pre-existing
      `flat-knowledgebase` repo `docs/ssh-access.md`) and, after Tailscale
      enrollment this pass, over the tailnet (`100.99.90.100`).
  - edge: phone-to-svc-aoteru
    from: phone
    to: "svc:aoteru"
    status: blocked-on-build
    note: >-
      svc:aoteru doesn't exist yet (P5/P6 build item), independent of
      whether a phone is reachable. Not a connectivity gap yet — a missing
      service.

