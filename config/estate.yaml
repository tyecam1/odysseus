# Aoteru estate — host/service registry (P1, plan section 4).
#
# Hosts are added here only once genuinely inventoried (hostname, live specs)
# — never speculatively. As of P0 (docs/aoteru-estate-p0-evidence.md) exactly
# one host is reachable from any execution session; the plan's "home"/"lab"
# roles are aspirational until a second host is actually registered by the
# operator. Do not invent a second host to make this file look complete.
#
# Services are logical names (plan section 5.6). None are provisioned yet —
# that's P2 (private connectivity). `endpoint: null` means "not live";
# `agent status` must report that plainly, not fabricate a reachable URL.

hosts:
  - id: hz2-workstation
    hostname: dmem-HP-Z2-Tower-G9-Workstation-Desktop-PC
    role: lab
    os: linux
    tailscale: true  # cap/is-admin, cap/is-owner, cap/ssh on this node's identity
    inventoried_at: "2026-08-19"
    notes: >-
      cpu_count/ram/disk are read live by `agent status`, not hardcoded here
      — hardware drifts, this file shouldn't. This is the only host this
      execution session's filesystem access reaches.

  - id: desktop-7dj1hma
    hostname: DESKTOP-7DJ1HMA
    role: home
    os: windows
    tailscale: true
    tailscale_dns: desktop-7dj1hma.tail171792.ts.net
    inventoried_at: "2026-08-19"
    admin_path: unresolved  # see docs/aoteru-estate-p2-evidence.md — SSH/RDP/WinRM all filtered as of P2
    notes: >-
      Tailscale peer only — no repo/hardware clone inventory possible until
      a remote-management path is reachable (P2 blocker). Do not assume
      Tailscale SSH works here: it does not terminate SSH on Windows: the
      intended transport is native Windows OpenSSH Server over Tailscale.

  - id: glovebox
    hostname: glovebox
    role: unassigned
    os: linux
    tailscale: true
    tailscale_dns: glovebox.tail171792.ts.net
    inventoried_at: "2026-08-19"
    notes: >-
      Offline at inventory time (last seen 32d ago per `tailscale status`).
      Out of scope for this phase's approved reconnaissance; re-audit once
      online and explicitly brought into scope.

services:
  - id: svc:aoteru
    description: authenticated Aoteru/Odysseus front door
    endpoint: null
  - id: svc:memory
    description: memory broker API (home primary, lab read-cache fallback)
    endpoint: null
  - id: svc:models-lab
    description: model serving on the lab host
    endpoint: null
  - id: svc:models-home
    description: model serving on the home host
    endpoint: null
  - id: svc:odysseus-lab
    description: Odysseus instance on the lab host
    endpoint: null
  - id: svc:odysseus-home
    description: Odysseus instance on the home host
    endpoint: null

# Domain permissions: which authority may request mutation routes through
# which host role. Populated once P3 parking exists; empty is correct for P1.
domain_permissions: []
