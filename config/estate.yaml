# Aoteru estate — host/service registry (P1, plan section 4).
#
# Hosts are added here only once genuinely inventoried or explicitly named
# by the operator — never speculatively. `verified: false` / `tailscale:
# false` / `os: unknown` mean exactly that: named, not yet confirmed. This
# execution session's own filesystem/shell access reaches only
# `hz2-workstation` (lab) — that is a session limitation, not a statement
# about the estate's real topology.
#
# P12 (2026-08-23, docs/aoteru-p12-active-estate-convergence.md) topology
# correction: this file previously conflated "laptop" and "interface" as
# one entity (`desktop-7dj1hma`, role: interface). Operator now states
# these are two distinct machines: `desktop-7dj1hma` is the laptop
# controller (currently reachable, live on tailnet), and the interface PC
# is a *separate*, currently-unreachable box (older Misumi deployment
# material references `192.168.4.37:8770` for it, but that identity is
# unverified — do not assume it still applies). The currently-reachable
# active estate is laptop + lab (this host) + glovebox Jetson; home and
# the separate interface PC are registered-but-ineligible, deferred per
# P12.7, not failed.
#
# Services are logical names (plan section 5.6). None are provisioned yet —
# that's P2 (private connectivity). `endpoint: null` means "not live";
# `agent status` must report that plainly, not fabricate a reachable URL.

# Required connectivity (re-derived 2026-08-19 from the canonical plan
# gates, not from what happens to be reachable from wherever this file is
# being edited): the plan's management/parking transport is laptop→worker
# (§10.2 "the launcher SSHs to the parked worker"), plus phone→svc:aoteru
# for the mobile surface. lab→laptop and lab→home are NOT gate
# requirements — an earlier revision of this registry/evidence mistakenly
# treated lab→laptop unreachability as a P2 blocker. It isn't tracked here.
required_connectivity:
  - edge: laptop-to-lab
    from: desktop-7dj1hma
    to: hz2-workstation
    status: lab-side-ready-untested-end-to-end
    note: >-
      Lab sshd is confirmed active/listening/reachable via its own tailscale
      IP (self-check). The actual laptop→lab direction has not been tested
      because no session has run on the laptop yet — this session runs on
      the lab host, which is the wrong end to initiate this test from.
  - edge: laptop-to-home
    from: desktop-7dj1hma
    to: desktop-in7o23d
    status: untested
    note: >-
      Per the operator, interface and home are pre-configured for mutual
      LAN SSH. Not yet verified from a session running on the laptop. Home
      host identity itself is unverified — see that host's entry.
  - edge: phone-to-svc-aoteru
    from: phone
    to: "svc:aoteru"
    status: blocked-on-build
    note: >-
      svc:aoteru doesn't exist yet (P5/P6 build item), independent of
      whether a phone is reachable. Not a connectivity gap yet — a missing
      service.

hosts:
  - id: hz2-workstation
    hostname: dmem-HP-Z2-Tower-G9-Workstation-Desktop-PC
    role: lab
    os: linux
    tailscale: true  # cap/is-admin, cap/is-owner, cap/ssh on this node's identity
    inventoried_at: "2026-08-19"
    notes: >-
      cpu_count/ram/disk are read live by `agent status`, not hardcoded here
      — hardware drifts, this file shouldn't. This is the host this
      execution session's filesystem/shell access actually reaches; it is
      not itself a required endpoint of the laptop→lab/home connectivity
      tests, only one end of one of them.

  - id: desktop-7dj1hma
    hostname: DESKTOP-7DJ1HMA
    role: laptop  # operator's human controller/conversational surface (P12) — NOT a parking worker, NOT the interface PC
    os: windows
    tailscale: true
    tailscale_dns: desktop-7dj1hma.tail171792.ts.net
    inventoried_at: "2026-08-19"
    verified_live_at: "2026-08-23"  # `tailscale status` from lab: 100.75.44.26, active direct connection
    notes: >-
      Corrected 2026-08-19 (operator, twice): this is the laptop
      controller, not a worker. Corrected again 2026-08-23 (P12, operator
      truth): this is NOT the separate interface PC — those were
      previously conflated under `role: interface`. See the standalone
      `interface-pc` entry below for the deferred, distinct machine.
      Whether *lab* can reach *this* machine is not a plan requirement and
      is not tracked as a blocker — the required direction is this machine
      reaching lab/home, which needs a session running on the laptop
      itself to test. Do not assume Tailscale SSH works here regardless:
      it does not terminate SSH on Windows. Live at 2026-08-23 per
      `tailscale status` run from lab (100.75.44.26, active direct
      185.17.164.207:56189) — reachability from lab's *view* only; the
      required laptop→lab direction is still untested end-to-end (no
      session has run on the laptop itself).

  - id: interface-pc
    hostname: unknown  # do not guess — operator states it is a separate machine from desktop-7dj1hma; identity not yet live-confirmed
    role: interface
    os: unknown
    tailscale: false
    verified: false
    inventoried_at: "2026-08-23"
    notes: >-
      P12 topology repair: split out of the former conflated
      `desktop-7dj1hma` (role: interface) entity. Operator states the
      interface PC is a genuinely separate machine, currently unreachable
      via tailnet. Older Misumi deployment material references
      `192.168.4.37:8770` for an interface-role service, but that
      identity/hardware is unverified and MUST NOT be trusted without live
      confirmation. Registered-but-ineligible/deferred, not failed — see
      P12.7 re-entry checklist in
      docs/aoteru-p12-active-estate-convergence-evidence.md. Intended
      future purpose: persistent Aoteru/Misumi human-facing front door
      (svc:aoteru), phone/mobile bridge.

  - id: desktop-in7o23d
    hostname: DESKTOP-IN7O23D  # per docs/operations/odysseus-host-deployment.md
    aliases: [DESKTOP-IN7023D]  # operator's own message used this spelling once — treat both as unverified
    role: home
    os: unknown  # not yet observed — see notes
    tailscale: false
    verified: false
    inventoried_at: "2026-08-19"
    notes: >-
      NOT VERIFIED. Hostname/IP are sourced only from
      docs/operations/odysseus-host-deployment.md and the operator's own
      messages, which disagree on spelling (IN7O23D vs IN7023D). Per
      explicit operator instruction, do not trust this identity until
      confirmed live through the existing laptop→home LAN SSH path — that
      requires a session running on the laptop, which this session is not.
      Not present in `tailscale status` from the lab host under either
      spelling as of this check. P12 (2026-08-23): explicitly
      registered-but-ineligible/deferred, not a P12 failure — see the
      home-PC re-entry checklist in
      docs/aoteru-p12-active-estate-convergence-evidence.md. Its absence
      does not block laptop/lab/glovebox convergence.

  - id: glovebox
    hostname: glovebox
    role: experiment-edge  # P12: Jetson Orin Nano, ROS2/RealSense research-experiment host — never a general LLM/background worker
    os: linux
    tailscale: true
    tailscale_dns: glovebox.tail171792.ts.net
    inventoried_at: "2026-08-19"
    verified_live_at: null
    notes: >-
      P12 (2026-08-23): operator states this Jetson Orin Nano is currently
      connected and used for research experiments; role corrected from
      `unassigned` to `experiment-edge` on that operator statement. Live
      re-check from lab this pass (`tailscale status`, `tailscale ping`)
      still shows it OFFLINE, last seen 36d ago — a real discrepancy
      between operator statement and this session's own tailnet evidence,
      recorded truthfully rather than silently trusting either side. Prior
      research records (docs/aoteru-lab-local-model-strategy-2026-08-20.md
      and related) associate it with Jetson Linux/JetPack and S2-E1
      experiment storage at `/data/s2-e1`; treat all such detail as
      hypothesis, not confirmed, until it is next live-reachable and
      re-inventoried (P12.5). Capability tags intentionally left unset
      until live-verified — do not route `ros2`/`realsense`/
      `experiment-capture` work here on inventoried-but-unreachable status.
      Never eligible for generic `local-fast`/`code-fast`/background
      indexing regardless of reachability (P12 boundary 4).

services:
  - id: svc:aoteru
    description: authenticated Aoteru/Odysseus front door
    endpoint: null
    role: interface
    notes: >-
      Corrected 2026-08-20 (operator): belongs on the interface PC
      (desktop-7dj1hma), not lab. Lab hosts backend capability only. Stays
      null/deferred until the interface PC is reachable — do not stand up a
      lab-hosted stand-in and call it svc:aoteru.
  - id: svc:memory
    description: memory broker API (home primary, lab read-cache fallback)
    endpoint: null
  - id: svc:models-lab
    description: model serving on the lab host
    endpoint: null
  - id: svc:models-home
    description: model serving on the home host
    endpoint: null
  - id: svc:odysseus-lab
    description: Odysseus backend instance on the lab host (API/jobs/memory/
      RAG — not the user-facing interface)
    endpoint: http://dmem-hp-z2-tower-g9-workstation-desktop-pc.tail171792.ts.net:8080
    local_endpoint: http://127.0.0.1:7001  # what tailscale serve proxies to
    role: backend
    tailnet_exposure: live-http-tailnet-only
    notes: >-
      Running natively (venv, uvicorn, port 7001; upstream lab deployment
      already owns 7000). Own dedicated ChromaDB on 127.0.0.1:8101 —
      collection names are global/deterministic (src/chroma_client.py), so
      sharing port 8100 with the upstream deployment would mean writing
      into its live vector collections; kept fully separate instead.
      AUTH_ENABLED=true, LOCALHOST_BYPASS=false, verified (unauthenticated
      GET / -> 302, /api/health -> 200 unauthenticated by design).
      Exposed privately over the tailnet via `tailscale serve --bg
      --http=8080` (plain HTTP, no TLS — HTTPS Certificates aren't enabled
      for this tailnet). Confirmed via `tailscale serve status --json`:
      `Web` handler only, no `AllowFunnel` key — tailnet-only, not public.
      End-to-end self-test from this host over the tailnet URL: GET / -> 302,
      GET /api/health -> 200. Required a one-time operator-run
      `sudo tailscale set --operator=agent` — `tailscale serve` needs root
      otherwise, and sudo itself is classifier-blocked from this session.
      the cert requirement but network/identity actions have now been
      classifier-blocked twice this session (SSH reconnaissance earlier,
      cert issuance here) — treating that as a pattern to get explicit
      operator sign-off on, not route around.
  - id: svc:odysseus-home
    description: Odysseus instance on the home host
    endpoint: null

# Domain permissions: which authority may request mutation routes through
# which host role. Populated once P3 parking exists; empty is correct for P1.
domain_permissions: []
