  exemplar_capture_domain_agnostic: true
  exemplar_exact_prompt_required: true
  exemplar_candidate_capture_requires_execution_evidence: false
  exemplar_capture_grants_authority: false
  exemplar_promotion_requires_evidence_or_explicit_operator_review: true

